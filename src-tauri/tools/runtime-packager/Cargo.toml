[package]
name = "runtime-packager"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
dirs = "6.0"
flate2 = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
xz2 = "0.1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
