[package]
name = "box-state"
version = "0.1.0"
edition = "2021"

[dependencies]
box-foundation = { path = "../../core/box-foundation" }
box-scheduler = { path = "../../core/box-scheduler" }
box-toolchains = { path = "../box-toolchains" }
box-dsh-versions = { path = "../box-dsh-versions" }
box-containers = { path = "../box-containers" }
box-extensions = { path = "../box-extensions" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The deletion queue names its entries with uuids (merged from box-data-scheduler).
uuid = { version = "1.18", features = ["v4"] }
