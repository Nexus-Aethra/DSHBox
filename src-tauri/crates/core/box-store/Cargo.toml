[package]
name = "box-store"
version = "0.1.0"
edition = "2021"

[dependencies]
box-foundation = { path = "../box-foundation" }
box-scheduler = { path = "../box-scheduler" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1.0"
tracing.workspace = true

# Windows only, and only for the security calls that write an explicit DACL
# on the secrets database. 0.61 rather than the 0.45 box-foundation uses:
# 0.45 has no EXPLICIT_ACCESS_W / TRUSTEE_W and no Win32_System_Threading,
# and building an ACL without them is not possible. 0.61 is already in the
# lock file from twenty-odd other dependents, so this adds no new crate to
# the graph and the layering guard, which checks package-to-package edges
# rather than versions, is unaffected.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
box-foundation = { path = "../box-foundation", features = ["test-kit"] }
# For the Windows ACL tests, which need a real file on a real filesystem to
# write a DACL onto. A memory store cannot carry a DACL.
tempfile = "3"
