[package]
name = "box-foundation"
version = "0.1.0"
edition = "2021"

[features]
# Exposes `collection::test_kit` so backend crates (box-store today, a
# future Postgres crate) can run the shared DocumentStore contract suite.
test-kit = []

[dependencies]
dirs = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Logging lives here now (merged from box-logger): one tracing facade for every
# binary, with the workspace pinning the versions so they cannot drift.
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.45", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
