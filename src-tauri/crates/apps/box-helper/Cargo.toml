[package]
name = "box-helper"
version = "0.1.0"
edition = "2021"
description = "Stage-A node helper: registers with the DSH Box control plane and keeps a heartbeat"

[[bin]]
name = "box-helper"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"

# The node link: the same crate the daemon uses, so the two ends cannot
# disagree about the protocol. It brings ring and serde, both already in the
# offline cache and both dependency-light -- the helper still has no network
# dependency and builds on any Linux target.
box-node-link = { path = "../../domain/box-node-link" }
