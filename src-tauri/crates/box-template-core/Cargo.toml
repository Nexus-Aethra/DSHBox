[package]
name = "box-template-core"
version = "0.1.0"
edition = "2021"
description = "Unified template install/uninstall core shared by dshboxd daemon and dshbox CLI."

[dependencies]
box-foundation = { workspace = true }
box-dsh-versions = { workspace = true }
box-data-scheduler = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { workspace = true }

[lib]
path = "src/lib.rs"