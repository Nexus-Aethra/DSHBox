[package]
name = "box-resources"
version = "0.1.0"
edition = "2021"
description = "Container resource kinds: discovery, extraction and injection."

[dependencies]
box-foundation = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tar = "0.4"
flate2 = "1.1"

[lib]
path = "src/lib.rs"
