[package]
name = "dshbox"
version = "0.1.10"
description = "Managed DeepSeek Harness desktop runtime"
authors = ["Nexus-Aethra"]
edition = "2021"
default-run = "dshbox"

[workspace]
members = [
  # Four layers, one direction: apps -> edge -> domain -> core. The layout is
  # documentation as much as structure: a crate in core/ cannot reach business
  # code, and scripts/check-layering.mjs fails the check if one tries.
  # See docs/design/2026-11-08-node-link-session-and-crate-layering.md section 14.
  "crates/core/*",
  "crates/domain/*",
  "crates/edge/*",
  "crates/apps/*",
  "tools/runtime-packager",
]
resolver = "2"

[workspace.dependencies]
# Unified tracing facade across all crates. Each crate re-uses these via
# `tracing.workspace = true` so version drift is impossible.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"
# Crates published under this workspace; `path = ...` keeps Cargo from
# treating the dep declaration as a registry lookup.
box-foundation = { path = "./crates/core/box-foundation" }
box-dsh-versions = { path = "./crates/domain/box-dsh-versions" }
box-state = { path = "./crates/domain/box-state" }

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[features]
# Enabled by `tauri build` (and required for manual `cargo build` releases):
# without it the binary runs in dev mode and the main window loads devUrl
# (http://localhost:1420) instead of the embedded frontend.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
dirs = "6.0.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.18", features = ["v4"] }
ctrlc = "3.4"
tar = "0.4"
flate2 = "1.1"
tauri = { version = "2.10.2", features = ["tray-icon"] }
tauri-plugin-dialog = "2.4.0"
webbrowser = "1.0"
xz2 = "0.1"
box-foundation = { path = "./crates/core/box-foundation" }
box-api = { path = "./crates/core/box-api" }
box-scheduler = { path = "./crates/core/box-scheduler" }
box-runtime = { path = "./crates/core/box-runtime" }
box-toolchains = { path = "./crates/domain/box-toolchains" }
box-dsh-versions = { path = "./crates/domain/box-dsh-versions" }
box-containers = { path = "./crates/domain/box-containers" }
box-extensions = { path = "./crates/domain/box-extensions" }
box-image = { path = "./crates/domain/box-image" }
box-plugin-graph = { path = "./crates/domain/box-plugin-graph" }
box-resources = { path = "./crates/domain/box-resources" }
box-state = { path = "./crates/domain/box-state" }
box-server-core = { path = "./crates/edge/box-server-core" }
box-client = { path = "./crates/edge/box-client" }
box-template-core = { path = "./crates/domain/box-template-core" }
box-store = { path = "./crates/core/box-store" }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Window-chrome fixes (src/desktop/app/titlebar.rs): an undecorated maximize
# covers the taskbar on Windows — this pins it to the monitor's work area.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "dshbox"
path = "src/main.rs"
