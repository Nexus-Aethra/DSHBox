name: Publish the sandbox plugin

# The plugin has its own version line, separate from the app's. The app is at
# 0.1.8 and the plugin at 0.1.0; binding the plugin to the app tag would force
# it to 0.1.9 next, and the versions between would never exist -- wrong for a
# package with consumers of its own. So the trigger is a plugin-scoped tag.
#
# The name deliberately does not start with v: release.yml matches v*, and a
# tag both workflows claimed would build installers on a plugin push.
on:
  push:
    tags: ["dsh-box-sandbox-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match package.json)"
        required: false
        type: string

# Provenance records that this tarball came from this repository at this
# commit. Trusted publishing also means no long-lived npm token exists to
# leak -- the credential is minted per-run from the job's OIDC identity.
permissions:
  contents: read
  id-token: write

env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  publish:
    name: Build, verify and publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Not 20: the packageManager pin imports node:sqlite and refuses
          # to start below Node 22.13.
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The plugin's devDependencies are self-contained (tsdown, typescript,
      # @types/node), so a filtered install skips the app's tree.
      - name: Install the plugin's dependencies
        run: pnpm install --filter @nexus-aethra/dsh-box-sandbox --frozen-lockfile

      # Same discipline release.yml applies to the app: a tag that disagrees
      # with the manifest publishes a version nobody asked for, and npm does
      # not take it back.
      - name: Check the tag against the plugin version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#dsh-box-sandbox-v}"
          version="$(node -p "require('./plugins/dsh-box-sandbox/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error file=plugins/dsh-box-sandbox/package.json::tag says $tag, package.json says $version"
            exit 1
          fi
          echo "publishing $version"

      - name: Typecheck
        working-directory: plugins/dsh-box-sandbox
        run: pnpm run typecheck

      # check:outputs reconciles every tool's output schema against the keys
      # dshboxd actually returns. Six tools shipped with a schema that
      # disagreed with their own result, and the host refuses those calls at
      # runtime with nothing failing at build time -- so this gate is the
      # reason the tag pipeline is not just build-and-upload.
      #
      # check:tools is deliberately NOT run here: it calls every tool against a
      # live daemon, which a runner cannot provide. It is a local check, for
      # the change about to be tagged.
      - name: Reconcile tool output schemas
        working-directory: plugins/dsh-box-sandbox
        run: pnpm run check:outputs

      # dist/ is gitignored, so the tarball is built here rather than restored
      # from the commit. Publishing without this ships whatever stale dist/
      # happens to be in the workspace.
      - name: Build
        working-directory: plugins/dsh-box-sandbox
        run: pnpm run build

      - name: Show what would be published
        working-directory: plugins/dsh-box-sandbox
        run: npm pack --dry-run

      - name: Read the current and published versions
        id: meta
        working-directory: plugins/dsh-box-sandbox
        run: |
          version="$(node -p "require('./package.json').version")"
          published="$(npm view @nexus-aethra/dsh-box-sandbox version 2>/dev/null || echo '')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "local=$version  npm=${published:-none}"

      # A re-run of the same tag must not fail on a version already out.
      # Publishing an existing version is a hard npm error, and a failed
      # workflow on a tag that already built hides a real failure.
      - name: Skip a version that is already published
        id: skip
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PUBLISHED: ${{ steps.meta.outputs.published }}
        run: |
          if [ -n "$PUBLISHED" ] && [ "$PUBLISHED" = "$VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION is already on npm; nothing to do"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A tag below what npm already has is nearly always a mistake.
      # npm would accept it, and a fresh install would silently downgrade.
      - name: Refuse to publish below what npm has
        if: steps.skip.outputs.changed == 'true' && steps.meta.outputs.published != ''
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PUBLISHED: ${{ steps.meta.outputs.published }}
        run: |
          lowest="$(printf '%s\n%s\n' "$PUBLISHED" "$VERSION" | sort -V | head -1)"
          if [ "$lowest" != "$PUBLISHED" ]; then
            echo "::error::refusing to publish $VERSION when npm already has $PUBLISHED"
            exit 1
          fi

      - name: Publish to npm
        if: steps.skip.outputs.changed == 'true'
        working-directory: plugins/dsh-box-sandbox
        run: npm publish --provenance --access public

      - name: Summary
        if: always()
        working-directory: plugins/dsh-box-sandbox
        run: |
          {
            echo "### Sandbox plugin"
            echo ""
            echo "- version: $(node -p "require('./package.json').version")"
            echo "- tag: ${{ github.ref_name }}"
            echo "- published: ${{ steps.skip.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"

